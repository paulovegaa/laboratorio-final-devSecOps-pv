name: SonarCloud analysis

on:
  push:
  workflow_dispatch:
jobs:
  SAST :
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args:
            -Dsonar.projectKey=${{ secrets.SONARCLOUD_PROJECTKEY }}
            -Dsonar.organization=${{ secrets.SONARCLOUD_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
          projectBaseDir: .
      - name: Validate Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_COMPLETE: ${{ github.repository_owner }}_${{ github.event.repository.name }}
        run: |
          echo "Validando el estado del Quality Gate... $SONAR_TOKEN , $REPO_NAME, $REPO_OWNER"
          analysisId=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/ce/component?component=$REPO_COMPLETE" | jq -r '.current.analysisId')
          echo "analysisId: $analysisId."

          qualityGateStatus=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?analysisId=$analysisId" | jq -r '.projectStatus.status')

          if [ "$qualityGateStatus" != "OK" ]; then
            echo "El proyecto no cumple con el Quality Gate: $qualityGateStatus."
            echo "Verificando vulnerabilidades críticas..."
            vulnerabilities=$(curl -s -u "$SONAR_TOKEN:" \
              "https://sonarcloud.io/api/issues/search?componentKeys=$REPO_COMPLETE&types=VULNERABILITY&severities=CRITICAL,BLOCKER" | jq -r '.total')
            echo "total de vulnerabilidades encontradas: $vulnerabilities."
            if [ "$vulnerabilities" -gt 0 ]; then
              echo "Se encontraron $vulnerabilities vulnerabilidades críticas, bloqueantes. El proyecto no cumple con los estándares de seguridad."
              #exit 1
            fi
          else
            echo "Verificando existencia de vulnerabilidades medias..."
            vulnerabilitiesMajor=$(curl -s -u "$SONAR_TOKEN:" \
              "https://sonarcloud.io/api/issues/search?componentKeys=$REPO_COMPLETE&types=VULNERABILITY&severities=MAJOR" | tee response.json | jq -r '.total')
            respuesta=$(curl -s -u "$SONAR_TOKEN:" \
              "https://sonarcloud.io/api/issues/search?componentKeys=$REPO_COMPLETE&types=VULNERABILITY&severities=MAJOR")
            echo "respuesta servicio:"
            echo "$respuesta"
            echo "total de vulnerabilidades encontradas: $vulnerabilitiesMajor ."
            if [ "$vulnerabilitiesMajor" -gt 0 ]; then
              echo "Se encontraron $vulnerabilitiesMajor vulnerabilidades  medias. El proyecto no cumple con los estándares de seguridad."
              #exit 1
            fi
            echo "El proyecto cumple con el Quality Gate y no tiene vulnerabilidades críticas. Continuando sin problemas."
          fi
  SCA:
    needs: SAST
    runs-on: ubuntu-24.04
    steps:
    
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Dependency Check
      uses: dependency-check/Dependency-Check_Action@1.1.0
      env:
        JAVA_HOME: /opt/jdk
      id: Depcheck
      with:
        project: '${{ github.event.repository.name }}'
        path: '.'
        format: 'HTML'
        args: >
          --out ./reports
          --failOnCVSS 7
          --enableRetired
    - name: Parse results and set output variables
      id: parse-results
      run: |
        # Extract counts by severity using jq
        echo "leyendo carpeta reports $(ls ./reports)"
        CRITICAL=$(grep -o "CRITICAL</td>" ./reports/dependency-check-report.html | wc -l)
        HIGH=$(grep -o "HIGH</td>" ./reports/dependency-check-report.html | wc -l)
        MEDIUM=$(grep -o "MEDIUM</td>" ./reports/dependency-check-report.html | wc -l)
        LOW=$(grep -o "LOW</td>" ./reports/dependency-check-report.html | wc -l)
        
        echo "CRITICAL_COUNT=${CRITICAL}"
        echo "HIGH_COUNT=${HIGH}"
        echo "MEDIUM_COUNT=${MEDIUM}"
        echo "LOW_COUNT=${LOW}"
        
        # Fail if critical or high vulnerabilities exist
        if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$MEDIUM" -gt 0 ]; then
          echo "::error::Found ${CRITICAL} CRITICAL, ${HIGH} HIGH and ${MEDIUM} MEDIUM vulnerabilities!"
          #exit 1
        fi
    - name: Upload Test Result
      uses: actions/upload-artifact@master
      with:
        name: Depcheck Report
        path: ./reports
        
  DockerBuild:
    needs: SCA
    runs-on: ubuntu-24.04
    steps:
    
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}
    - name: Convert repository name to lowercase
      id: repo-name
      run: |
        echo "REPO_NAME=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USER }}/${{ env.REPO_NAME }}:latest
          ${{ secrets.DOCKER_USER }}/${{ env.REPO_NAME }}:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USER }}/${{ env.REPO_NAME }}:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USER }}/${{ env.REPO_NAME }}:buildcache,mode=max
  DockerScan:
    needs: DockerBuild
    runs-on: ubuntu-24.04
    steps:
    
    - name: Docker Login
      uses: docker/login-action@v3.0.0
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}
    
    - name: Pull Docker
      run: |
        docker pull paulovegaa/laboratorio-final-devsecops-pv:latest

    - name: Run Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'paulovegaa/laboratorio-final-devsecops-pv:latest'
        format: 'table'
        severity: 'CRITICAL,HIGH,MEDIUM'
        ignore-unfixed: true
    - name: Deploy to Docker
      run: |
        docker run -d --name my-app -p 8080:8080 paulovegaa/laboratorio-final-devsecops-pv:latest
